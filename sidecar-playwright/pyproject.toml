[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-metaai-sidecar"
version = "0.1.0"
description = "Drop-in Playwright-based replacement for metaai_api.api_server (chat only). Same HTTP contract; uses headless Chromium against meta.ai."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["playwright_metaai_sidecar*"]
